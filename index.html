/* Layout: patio de juegos — portada con tres puertas de colores; dentro, una fila de fichas de actividades y un tablero por actividad.
   Mundo visual único (claro, de cartulina y papel cuadriculado), elegido a propósito para chicos y chicas: no cambia con el tema oscuro. */
:root{
  color-scheme: light;
  --bg:#F2F5FF;          /* papel celeste muy claro */
  --paper:#FFFFFF;
  --ink:#1D2140;         /* tinta azul noche */
  --muted:#5B6185;
  --line:#D9DEF5;
  --tomato:#FF5A4E; --sun:#FFB800; --grass:#1DB66B; --sky:#2F8CFF; --grape:#8A4DFF; --pink:#FF4F9A; --teal:#00B3B8;
  --ok:#14A35A; --okbg:#E3F8EC; --bad:#E5383B; --badbg:#FFE8E6;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* ---------- portada ---------- */
.hero{text-align:center;padding-block:18px 10px}
.hero h1{font-size:clamp(2.6rem,9vw,4.8rem);line-height:1}
.hero h1 span{display:inline-block}
.hero h1 span:nth-child(7n+1){color:var(--tomato)} .hero h1 span:nth-child(7n+2){color:var(--sun)}
.hero h1 span:nth-child(7n+3){color:var(--grass)} .hero h1 span:nth-child(7n+4){color:var(--sky)}
.hero h1 span:nth-child(7n+5){color:var(--grape)} .hero h1 span:nth-child(7n+6){color:var(--pink)} .hero h1 span:nth-child(7n){color:var(--teal)}
.hero p{margin:.4rem auto 0;color:var(--muted);font-size:1.05rem;max-width:44ch}
.hero .sig{display:inline-block;margin-top:.6rem;font-weight:700;color:var(--grape);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:.15rem .9rem;transform:rotate(-2deg)}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
@media (max-width:760px){.doors{grid-template-columns:1fr}}
.door{position:relative;border:3px solid var(--ink);border-radius:24px;padding:22px 20px 20px;text-align:left;color:#fff;
  box-shadow:6px 6px 0 var(--ink);transition:transform .15s,box-shadow .15s;overflow:hidden;min-height:210px;display:flex;flex-direction:column;gap:8px}
.door:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.door:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.door.y1{background:var(--tomato)} .door.y2{background:var(--sky)} .door.y3{background:var(--grass)}
.door .big{font-family:var(--display);font-size:4rem;line-height:.9}
.door .topics{font-weight:600;font-size:.98rem;opacity:.97}
.door .lock{margin-top:auto;display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.22);border-radius:999px;padding:.25rem .75rem;font-weight:700;font-size:.9rem;align-self:flex-start}
.door .deco{position:absolute;right:-18px;top:-14px;font-family:var(--display);font-size:7rem;opacity:.16;line-height:1;pointer-events:none}
.homeNote{margin:26px auto 0;max-width:60ch;text-align:center;color:var(--muted);font-size:.95rem}

/* ---------- modal clave ---------- */
.overlay{position:fixed;inset:0;background:rgba(29,33,64,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);width:min(420px,100%);padding:24px}
.modal h2{font-size:1.9rem}
.modal p{color:var(--muted);margin:.3rem 0 1rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:600;font-size:.92rem}
.field input{border:2px solid var(--ink);border-radius:12px;padding:.6rem .8rem;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2.5px solid var(--ink);border-radius:999px;padding:.5rem 1.1rem;font-weight:700;background:var(--sun);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)} .btn.go{background:var(--grass);color:#fff} .btn.blue{background:var(--sky);color:#fff} .btn.pink{background:var(--pink);color:#fff}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- sección ---------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;box-shadow:5px 5px 0 var(--ink)}
.bar h2{font-size:clamp(1.5rem,4vw,2.1rem)}
.bar .hi{color:var(--muted);font-size:.95rem}
.bar .spacer{flex:1}
.stars{display:inline-flex;align-items:center;gap:.35rem;font-weight:700;background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:.2rem .8rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 16px}
.chip{border:2.5px solid var(--ink);border-radius:14px;padding:.45rem .85rem;font-weight:700;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-size:.95rem}
.chip[aria-pressed="true"]{color:#fff}
.chip:nth-child(7n+1)[aria-pressed="true"]{background:var(--tomato)} .chip:nth-child(7n+2)[aria-pressed="true"]{background:var(--sky)}
.chip:nth-child(7n+3)[aria-pressed="true"]{background:var(--grass)} .chip:nth-child(7n+4)[aria-pressed="true"]{background:var(--grape)}
.chip:nth-child(7n+5)[aria-pressed="true"]{background:var(--pink)} .chip:nth-child(7n+6)[aria-pressed="true"]{background:var(--teal)}
.chip:nth-child(7n)[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.panel>h3,.phead h3{font-size:1.8rem;margin-bottom:.2rem}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.phead .intro{color:var(--muted);margin:0 0 18px;max-width:70ch}
.homeRank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
@media (max-width:760px){.homeRank{grid-template-columns:1fr}}
.rk{display:flex;justify-content:space-between;gap:8px;padding:.25rem 0;border-bottom:1px dashed rgba(29,33,64,.2);font-variant-numeric:tabular-nums}
.rk span{min-width:0;overflow-wrap:anywhere}
.panel>.intro{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.card{border:2.5px solid var(--ink);border-radius:var(--r);padding:16px;background:var(--paper);min-width:0}
.card.c0{background:#FFF1EF} .card.c1{background:#EAF3FF} .card.c2{background:#E7F8EF} .card.c3{background:#F2EBFF} .card.c4{background:#FFEAF3} .card.c5{background:#E3F7F7} .card.c6{background:#FFF6DB}
.card h4{margin:0 0 6px;font-size:1.05rem}
.card .n{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:.9rem;margin-right:.4rem;flex:none}
.q{display:flex;align-items:flex-start;gap:.3rem;font-weight:500}
.q .txt{min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{border:2px solid var(--ink);border-radius:12px;padding:.4rem .8rem;background:#fff;font-weight:600;min-height:44px}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt svg{display:block}
.fb{margin-top:10px;border-radius:12px;padding:.55rem .8rem;font-size:.95rem}
.fb.good{background:var(--okbg);color:#0B6B3A;border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);color:#9B1C1F;border:2px solid var(--bad)}
.fb.info{background:#F2EBFF;border:2px solid var(--grape);color:#4A2591}
.ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.ans input{border:2px solid var(--ink);border-radius:12px;padding:.45rem .7rem;width:9rem;background:#fff}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.small{font-size:.88rem;color:var(--muted)}
.theory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.theory{grid-template-columns:1fr}}
.theory .card h4{font-family:var(--display);font-weight:400;font-size:1.35rem}
.theory .ex{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:.5rem .7rem;margin-top:8px}

/* ---------- matemática en línea ---------- */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.9em;line-height:1.12;margin:0 .1em;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}
.pa{font-size:1.7em;font-weight:300;vertical-align:middle;line-height:1}
.m sup,.q sup,.fb sup,.opt sup,.cell sup,.mem sup{font-size:.68em}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .1em}
.rt .ix{font-size:.62em;align-self:flex-start;margin-right:-.4em;margin-top:.05em}
.rt .s{font-size:1.45em;line-height:1.05}
.rt .rad{border-top:2px solid currentColor;display:inline-flex;align-items:center;padding:0 .15em;margin-top:.18em}
.mbig{font-size:1.35em}

/* ---------- memotest ---------- */
.memhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.memgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mem{aspect-ratio:1/1;max-width:100%;border:2.5px solid var(--ink);border-radius:14px;background:var(--grape);color:#fff;font-weight:700;display:grid;place-items:center;font-size:1.15rem;padding:6px;transition:transform .2s;position:relative;overflow:hidden}
.mem .back{font-family:var(--display);font-size:2rem;opacity:.85}
.mem:nth-child(4n+2){background:var(--sky)} .mem:nth-child(4n+3){background:var(--pink)} .mem:nth-child(4n){background:var(--teal)}
.mem.open{background:#fff!important;color:var(--ink)}
.mem.done{background:var(--okbg)!important;color:var(--ink);border-color:var(--ok)}
.mem svg{width:80%;height:auto;max-height:80%}
.mem .mtx{font-size:clamp(.85rem,2.6vw,1.25rem);text-align:center}
.score2{display:flex;gap:8px}
.pl{border:2px solid var(--ink);border-radius:999px;padding:.15rem .7rem;font-weight:700;background:#fff}
.pl.on{background:var(--sun)}

/* ---------- contrarreloj ---------- */
.timer{display:grid;gap:16px;justify-items:center;text-align:center}
.clock{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.tq{font-size:1.6rem;font-weight:600;min-height:3.2rem;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.2rem}
.timer input{font-size:1.3rem;width:10rem;text-align:center;border:3px solid var(--ink);border-radius:14px;padding:.4rem}
.tstats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tstats .pl{font-variant-numeric:tabular-nums}
.progress{width:min(420px,100%);height:14px;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.progress>div{height:100%;background:var(--pink);transition:width 1s linear}

/* ---------- pintar ---------- */
.paintArea{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:16px 0}
.paintArea svg{width:min(220px,40vw);height:auto}
.paintArea .pbar svg{width:min(320px,80vw)}
.part{cursor:pointer;transition:fill .15s}
.part:hover{opacity:.85}

/* ---------- ta-te-ti ---------- */
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:440px;margin:0 auto}
.cell{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:600;font-size:1.2rem;display:grid;place-items:center;padding:4px;max-width:100%}
.cell.X{background:var(--tomato);color:#fff;font-family:var(--display);font-size:3.4rem}
.cell.O{background:var(--sky);color:#fff;font-family:var(--display);font-size:3.4rem}
.cell.sel{outline:4px solid var(--sun);outline-offset:2px}
.turn{text-align:center;font-weight:700;margin:4px 0 12px}
.turn b{font-family:var(--display);font-weight:400;font-size:1.5rem}

/* ---------- gráficos ---------- */
.graphbox{display:flex;justify-content:center}
.graphbox svg{width:min(320px,100%);height:auto}
.sliders{display:grid;gap:14px;width:min(360px,100%)}
.sliders label{display:flex;justify-content:space-between;font-weight:700}
.sliders input[type=range]{width:100%;accent-color:var(--grape)}
.catch{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:center}

/* ---------- murdoku ---------- */
.mk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:min(420px,100%);border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.mkc{aspect-ratio:1/1;border:1px solid rgba(29,33,64,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;position:relative;padding:0;background:transparent}
.mkc .rn{position:absolute;top:2px;left:3px;font-size:.55rem;font-weight:600;color:#3d4166;line-height:1;text-align:left}
.mkc .ic{font-size:1rem}
.mkc .who{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--tomato);line-height:1}
.mkwrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.mkwrap>div{min-width:0;flex:1 1 300px}
.clues{margin:0;padding-left:1.2rem}
.clues li{margin-bottom:.35rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend span{border:1.5px solid var(--ink);border-radius:8px;padding:.05rem .45rem;font-size:.8rem}

/* ---------- grupos de actividades ---------- */
.navg{display:grid;gap:12px;margin:20px 0 16px}
.navg .chips{margin:0}
.glabel{font-family:var(--display);font-size:1.15rem;margin-bottom:6px}
/* ---------- análisis de parábola ---------- */
.anl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:560px){.anl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.anl label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;min-width:0}
.anl input,.anl select,.tbl input{border:2px solid var(--ink);border-radius:10px;padding:.4rem .5rem;background:#fff;width:100%;min-width:0}
.okf{border-color:var(--ok)!important;background:var(--okbg)!important}
.badf{border-color:var(--bad)!important;background:var(--badbg)!important}
.tblwrap{overflow-x:auto;margin-top:10px}
.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:2px solid var(--ink);padding:.3rem .4rem;text-align:center;min-width:3.6rem}
.tbl th{background:var(--sun)}
.tbl input{width:3.6rem;text-align:center;padding:.3rem}
/* ---------- murdoku: lápices ---------- */
.pens{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pen{min-width:44px;height:44px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-family:var(--display);font-size:1.3rem;padding:0 .4rem}
.pen.on{background:var(--sun);box-shadow:3px 3px 0 var(--ink);transform:translateY(-2px)}
.mkc .xx{color:#8C92B4;font-size:1.5rem;line-height:1}
.mkc .ic2{position:absolute;bottom:1px;right:3px;font-size:.62rem}
.mkc .ob{font-size:1.5rem;line-height:1}
.mktitle{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0}
/* ---------- confeti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:.55rem 1.2rem;font-weight:700;z-index:90;box-shadow:0 6px 0 rgba(0,0,0,.15)}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<canvas id="confetti"></canvas>

<script>
/* =========================================================
   Utilidades
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s);
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const nf=(n,d)=>`−${fr(n,d)}`;
const P=x=>`<span class="pa">(</span>${x}<span class="pa">)</span>`;
const B=x=>`<span class="pa">[</span>${x}<span class="pa">]</span>`;
const pw=(x,e)=>`${x}<sup>${e}</sup>`;
const rt=(x,i)=>`<span class="rt">${i?`<span class="ix">${i}</span>`:''}<span class="s">√</span><span class="rad">${x}</span></span>`;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a*b/gcd(a,b);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hh(s){let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36)}
/* respuesta como [num,den] o número; muestra en html */
function val(a){return Array.isArray(a)?a[0]/a[1]:a}
function showAns(a){if(!Array.isArray(a))return String(a).replace('-','−').replace('.',',');let[n,d]=a;const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}if(d===1)return String(n).replace('-','−');return n<0?nf(-n,d):fr(n,d)}
/* lee lo que escribe el chico: 3/4, -3/4, −3/4, 0,25, 5 */
function parseIn(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(',','.');
  if(/^[-+]?\d+(\.\d+)?$/.test(s))return{v:+s,frac:null};
  let m=s.match(/^([-+]?)\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/);
  if(m){const n=+m[2]*(m[1]==='-'?-1:1),d=+m[3];if(d===0)return null;return{v:n/d,frac:[n,d]}}
  return null}
function check(input,ans){const p=parseIn(input);if(!p)return{ok:false,bad:true};const ok=Math.abs(p.v-val(ans))<1e-9;
  let simp=false;if(ok&&p.frac&&gcd(p.frac[0],p.frac[1])>1)simp=true;return{ok,simp}}

/* ---------- confeti ---------- */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}sizeCv();addEventListener('resize',sizeCv);
function confetti(n=70){if(reduce)return;const cols=['#FF5A4E','#FFB800','#1DB66B','#2F8CFF','#8A4DFF','#FF4F9A','#00B3B8'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:6+Math.random()*6,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:90+Math.random()*40});
  if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):null;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
let toastT;function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}
const cheers=['¡Bien ahí!','¡Genia/o!','¡Excelente!','¡Crack!','¡Perfecto!','¡Así se hace!','¡Impecable!'];
const oops=['Casi… mirá la explicación','¡Ups! Volvé a intentarlo','No es esa, pero vas bien'];

/* =========================================================
   Estado
   ========================================================= */
const state={year:null,name:'',points:{1:0,2:0,3:0},done:new Set(),act:null,best:{},gen:0,genMap:{}};
try{const b=JSON.parse(localStorage.getItem('am_best')||'{}');state.best=b}catch(e){}
function fk(k){return `${state.year}|${state.act}|${state.gen}|${k}`}
function award(key,pts=10){const k=fk(key);if(state.done.has(k))return;state.done.add(k);state.points[state.year]+=pts;syncMe()}
function penalize(key){const k=fk(key);if(state.done.has(k)||state.done.has(k+'#pen'))return;state.done.add(k+'#pen');state.points[state.year]=Math.max(0,state.points[state.year]-5);syncMe();toast('−5 puntos por ver la solución')}
function solBtn(btn,reveal,key){const lbl=btn.textContent;btn.onclick=()=>{if(btn.dataset.arm){reveal();penalize(key);btn.disabled=true;btn.textContent='Solución vista';return}btn.dataset.arm='1';btn.textContent='¿Seguro? Resta 5 puntos';btn.classList.add('pink');setTimeout(()=>{if(!btn.disabled){delete btn.dataset.arm;btn.textContent=lbl;btn.classList.remove('pink')}},4000)}}
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =========================================================
   Componentes
   ========================================================= */
/* Preguntas con opciones (también Verdadero/Falso) */
function quiz(el,items,key){
  items.forEach((it,i)=>{
    const c=document.createElement('div');c.className='card c'+(i%7);
    let opts=it.opts.map((o,k)=>({o,k}));if(!it.keep)opts=shuffle(opts);
    c.innerHTML=`<div class="q"><span class="n">${i+1}</span><div class="txt m">${it.q}</div></div><div class="opts"></div><div class="fbx"></div>`;
    const box=$('.opts',c);
    opts.forEach(({o,k})=>{const b=document.createElement('button');b.className='opt m';b.innerHTML=o;b.onclick=()=>{
      const right=k===it.ok;b.classList.add(right?'right':'wrong');
      if(right){box.querySelectorAll('button').forEach(x=>x.disabled=true);award(key+i);confetti(40);}
      else{b.disabled=true;c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),400)}
      $('.fbx',c).innerHTML=`<div class="fb ${right?'good':'bad'}"><b>${right?pick(cheers):pick(oops)}</b>${right&&it.exp?' '+it.exp:(!right&&it.why?' '+it.why:'')}</div>`;
    };box.appendChild(b)});
    el.appendChild(c)});
}
/* Preguntas con respuesta escrita */
function inputs(el,items,key){
  items.forEach((it,i)=>{
    const c=document.createElement('div');c.className='card c'+(i%7);
    const id=key+'_'+i;
    c.innerHTML=`<div class="q"><span class="n">${i+1}</span><div class="txt m">${it.q}</div></div>
      <div class="ans"><input id="${id}" inputmode="text" autocomplete="off" aria-label="Tu respuesta" placeholder="${it.ph||'tu respuesta'}"><button class="btn go">Comprobar</button><button class="btn ghost" data-sol>Ver solución</button></div>
      <div class="fbx"></div>`;
    const inp=$('input',c),[bt,bs]=c.querySelectorAll('button');let tries=0;
    const go=()=>{if(!inp.value.trim())return;const r=check(inp.value,it.ans);tries++;
      if(r.ok){award(key+i);confetti(45);$('.fbx',c).innerHTML=`<div class="fb good"><b>${pick(cheers)}</b> ${r.simp?'Está bien, pero simplificala: '+showAns(it.ans)+'. ':''}${it.sol?it.sol:''}</div>`}
      else{c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),400);$('.fbx',c).innerHTML=`<div class="fb bad"><b>${r.bad?'Escribí un número o una fracción (por ejemplo 3/4 o −2).':pick(oops)}</b>${it.hint&&!r.bad?' Pista: '+it.hint:''}</div>`}};
    bt.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
    solBtn(bs,()=>{$('.fbx',c).innerHTML=`<div class="fb info"><b>Respuesta: ${showAns(it.ans)}</b>${it.sol?'<br>'+it.sol:''}</div>`},key+i);
    el.appendChild(c)});
}
/* Memotest (1 o 2 jugadores) */
function memo(el,pairs,key){
  el.innerHTML=`<div class="memhead"><label class="row" style="gap:6px;font-weight:600"><input type="checkbox" id="${key}_2p"> Jugar de a 2</label>
    <span class="pl" id="${key}_mv">Intentos: 0</span><span class="score2" id="${key}_sc" hidden><span class="pl on" data-p="0">Jugador 1: 0</span><span class="pl" data-p="1">Jugador 2: 0</span></span>
    <button class="btn ghost" id="${key}_re">Mezclar de nuevo</button></div><div class="memgrid"></div><div class="fbx"></div>`;
  const grid=$('.memgrid',el);let open=[],lock=false,moves=0,found=0,turn=0,sc=[0,0];
  const two=$('#'+key+'_2p',el),scEl=$('#'+key+'_sc',el);
  two.onchange=()=>{scEl.hidden=!two.checked};
  function upd(){$('#'+key+'_mv',el).textContent='Intentos: '+moves;scEl.querySelectorAll('.pl').forEach(p=>{const k=+p.dataset.p;p.textContent=`Jugador ${k+1}: ${sc[k]}`;p.classList.toggle('on',k===turn)})}
  function deal(){grid.innerHTML='';open=[];lock=false;moves=0;found=0;turn=0;sc=[0,0];$('.fbx',el).innerHTML='';upd();
    const cards=shuffle(pairs.flatMap((p,i)=>[{h:p[0],id:i},{h:p[1],id:i}]));
    cards.forEach(cd=>{const b=document.createElement('button');b.className='mem';b.setAttribute('aria-label','Tarjeta boca abajo');b.innerHTML='<span class="back">?</span>';
      b.onclick=()=>{if(lock||b.classList.contains('open')||b.classList.contains('done'))return;
        b.classList.add('open');b.innerHTML=`<span class="mtx m">${cd.h}</span>`;open.push({b,cd});
        if(open.length===2){moves++;const[a,c]=open;
          if(a.cd.id===c.cd.id){a.b.classList.add('done');c.b.classList.add('done');open=[];found++;sc[turn]++;confetti(25);

    else q.innerHTML=`¡Tiempo! Resolviste ${g}.`;if(g>=5)award(key,20)}
  function submit(){if(!inp.value.trim())return;const r=check(inp.value,cur.ans);if(r.ok){g++;$('#'+key+'_g',el).textContent=g;fb.innerHTML='✔ ¡Bien!';confetti(15)}else{b++;$('#'+key+'_b',el).textContent=b;fb.innerHTML=`✘ Era ${showAns(cur.ans)}`;inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400)}next()}

    t=setInterval(()=>{left--;$('#'+key+'_c',el).textContent=left;$('#'+key+'_p',el).style.width=(left/secs*100)+'%';if(left<=0)end()},1000)};
  ok.onclick=submit;inp.onkeydown=e=>{if(e.key==='Enter')submit()};sk.onclick=()=>{fb.innerHTML=`Era ${showAns(cur.ans)}`;next()};

      bt.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};

function quizInline(sub,it,k,card){sub.className='opts';shuffle(it.opts.map((o,j)=>({o,j}))).forEach(({o,j})=>{const b=document.createElement('button');b.className='opt m';b.innerHTML=o;

/* ---------- dibujos de fracciones (SVG) ---------- */
const OR='#FFB547',ST='#1D2140';
function pieSvg(d,sh,size=100){let s=`<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="círculo dividido en ${d} partes, ${sh} pintadas">`;const r=size/2-3,c=size/2;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d;const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    s+=d===1?`<circle cx="${c}" cy="${c}" r="${r}" fill="${i<sh?OR:'#fff'}" stroke="${ST}" stroke-width="2.5"/>`:`<path d="M${c},${c} L${x0},${y0} A${r},${r} 0 ${1/d>.5?1:0} 1 ${x1},${y1} Z" fill="${i<sh?OR:'#fff'}" stroke="${ST}" stroke-width="2.5"/>`}
  return s+'</svg>'}
function barSvg(d,sh,w=120,h=44){let s=`<svg viewBox="-2 -2 ${w+4} ${h+4}" role="img" aria-label="rectángulo dividido en ${d} partes, ${sh} pintadas">`;const pw_=w/d;
  for(let i=0;i<d;i++)s+=`<rect x="${i*pw_}" y="0" width="${pw_}" height="${h}" fill="${i<sh?OR:'#fff'}" stroke="${ST}" stroke-width="2.5"/>`;return s+'</svg>'}
function gridSvg(cols,rows,sh,u=26){let s=`<svg viewBox="-2 -2 ${cols*u+4} ${rows*u+4}" role="img" aria-label="cuadrícula de ${cols*rows} partes, ${sh} pintadas">`;let k=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){s+=`<rect x="${c*u}" y="${r*u}" width="${u}" height="${u}" fill="${k<sh?OR:'#fff'}" stroke="${ST}" stroke-width="2.5"/>`;k++}return s+'</svg>'}
function multi(svgs){return `<span style="display:flex;gap:6%;width:100%;justify-content:center;align-items:center">${svgs.map(s=>`<span style="flex:1;display:flex;justify-content:center">${s}</span>`).join('')}</span>`}

/* ---------- gráfico de rectas (SVG) ---------- */
let gid=0;
function graph(lines,R=5,size=300){const u=size/(2*R),c=size/2;gid++;
  let s=`<svg viewBox="-14 -14 ${size+28} ${size+28}" role="img" aria-label="gráfico cartesiano"><defs><clipPath id="cl${gid}"><rect x="0" y="0" width="${size}" height="${size}"/></clipPath></defs><rect x="0" y="0" width="${size}" height="${size}" fill="#fff"/>`;
  for(let i=-R;i<=R;i++){const p=c+i*u;s+=`<line x1="${p}" y1="0" x2="${p}" y2="${size}" stroke="#DDE2F2" stroke-width="1"/><line x1="0" y1="${p}" x2="${size}" y2="${p}" stroke="#DDE2F2" stroke-width="1"/>`}
  s+=`<line x1="0" y1="${c}" x2="${size}" y2="${c}" stroke="${ST}" stroke-width="2"/><line x1="${c}" y1="0" x2="${c}" y2="${size}" stroke="${ST}" stroke-width="2"/>`;
  for(let i=-R;i<=R;i++){if(!i)continue;const p=c+i*u;s+=`<text x="${p}" y="${c+13}" font-size="9" text-anchor="middle" fill="#5B6185" font-family="Lexend,sans-serif">${i}</text><text x="${c-6}" y="${c-i*u+3}" font-size="9" text-anchor="end" fill="#5B6185" font-family="Lexend,sans-serif">${i}</text>`}
  s+=`<text x="${size-2}" y="${c-6}" font-size="12" font-weight="700" text-anchor="end" fill="${ST}">x</text><text x="${c+6}" y="11" font-size="12" font-weight="700" fill="${ST}">y</text>`;
  s+=`<g clip-path="url(#cl${gid})">`;
  for(const L of lines){const X=x=>c+x*u,Y=y=>c-y*u;if(L.f){let d='';for(let x=-R-1;x<=R+1.001;x+=0.05){const y=L.f(x);if(Math.abs(y)>R+8)continue;d+=(d?'L':'M')+X(x).toFixed(1)+','+Y(y).toFixed(1)}s+=`<path d="${d}" fill="none" stroke="${L.col}" stroke-width="${L.w||3.5}" stroke-linecap="round" stroke-linejoin="round"/>`;if(L.dots)for(const [x,y] of L.dots)s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="${L.col}" stroke="#fff" stroke-width="2"/>`;continue}s+=`<line x1="${X(-R-1)}" y1="${Y(L.a*(-R-1)+L.b)}" x2="${X(R+1)}" y2="${Y(L.a*(R+1)+L.b)}" stroke="${L.col}" stroke-width="${L.w||3.5}" ${L.dash?'stroke-dasharray="9 7"':''} stroke-linecap="round"/>`;
    if(L.dots)for(const [x,y] of L.dots)s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="${L.col}" stroke="#fff" stroke-width="2"/>`}
  return s+'</g></svg>'}
function fmtA(a){if(a===1)return'';if(a===-1)return'−';if(Number.isInteger(a))return String(a).replace('-','−');const f=toFrac(a);return (a<0?'−':'')+fr(Math.abs(f[0]),f[1])}
function toFrac(x){for(let d=1;d<=12;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9)return[n,d]}return[x,1]}
function formula(a,b,name='f(x)'){let s=name+' = ';if(a===0)return s+String(b).replace('-','−');s+=fmtA(a)+'x';if(b>0)s+=' + '+b;if(b<0)s+=' − '+(-b);return s}

/* juego de pintar */
function paintGame(el,RR){
  const rounds=RR||[{n:3,d:4,s:'bar'},{n:2,d:5,s:'pie'},{n:5,d:6,s:'pie'},{n:7,d:4,s:'bar'},{n:6,d:3,s:'bar'},{n:5,d:8,s:'grid'}];

/* ta-te-ti */
function tateti(el,genFn){
  const pool=[
    {q:pw(P(nf(2,3)),2),a:[4,9]},{q:pw(P(fr(1,2)),'−3'),a:8},{q:rt(fr(25,36)),a:[5,6]},{q:rt(nf(27,64),3),a:[-3,4]},{q:pw(P(nf(1,5)),0),a:1},
    {q:`${pw(P(fr(3,4)),2)} · ${pw(P(fr(3,4)),'−1')}`,a:[3,4]},{q:pw('(0,3)',2),a:[9,100]},{q:pw(P(nf(1,2)),3),a:[-1,8]},{q:rt('0,49'),a:[7,10]},
    {q:pw(P(fr(2,5)),2),a:[4,25]},{q:pw(P(nf(3,2)),'−1'),a:[-2,3]},{q:rt(fr(1,9)),a:[1,3]},{q:rt(fr(8,125),3),a:[2,5]},{q:pw('(−2)',5),a:-32},
    {q:pw(P(fr(1,10)),2),a:[1,100]},{q:`${pw(P(fr(1,2)),2)} · ${pw(P(fr(1,2)),2)}`,a:[1,16]},{q:rt('1,44'),a:[6,5]},{q:pw(P(nf(1,3)),'−2'),a:9}];
  let cells,owner,turn,sel,over;
  function start(){cells=genFn?genFn():shuffle(pool).slice(0,9);owner=Array(9).fill(null);turn='X';sel=null;over=false;render()}
  function win(p){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(l=>l.every(i=>owner[i]===p))}
  function render(){
    el.innerHTML=`<div class="turn" aria-live="polite">${over?over:`Turno de <b style="color:${turn==='X'?'var(--tomato)':'var(--sky)'}">${turn}</b>`}</div><div class="ttt"></div>
      <div class="card c6" style="margin:16px auto 0;max-width:440px" ${sel===null?'hidden':''}><div class="q"><div class="txt m">Resolvé: <span class="mbig">${sel!==null?cells[sel].q:''}</span></div></div>
      <div class="ans"><input id="ttt_in" aria-label="Respuesta" autocomplete="off" placeholder="respuesta"><button class="btn go">Listo</button></div><div class="fbx"></div></div>
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" data-r>Nueva partida</button></div>`;
    const g=$('.ttt',el);
    cells.forEach((c,i)=>{const b=document.createElement('button');b.className='cell m'+(owner[i]?' '+owner[i]:'')+(sel===i?' sel':'');b.innerHTML=owner[i]||`<span>${c.q}</span>`;b.disabled=!!owner[i]||!!over;
      b.onclick=()=>{sel=i;render();$('#ttt_in').focus()};g.appendChild(b)});
    $('[data-r]',el).onclick=start;
    if(sel!==null){const inp=$('#ttt_in'),go=()=>{if(!inp.value.trim())return;const r=check(inp.value,cells[sel].a);const fb=$('.fbx',el);
      if(r.ok){owner[sel]=turn;confetti(35);if(win(turn)){over=`¡Ganó ${turn}! 🎉`;award('ttt',20);confetti(160)}else if(owner.every(Boolean))over='¡Empate!';sel=null;if(!over)turn=turn==='X'?'O':'X';render()}
      else{fb.innerHTML=`<div class="fb bad"><b>No es correcto: era ${showAns(cells[sel].a)}.</b> Pierde el turno.</div>`;setTimeout(()=>{sel=null;turn=turn==='X'?'O':'X';render()},1800)}};
      $('.btn.go',el).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
  }
  start()}

const mn=v=>String(v).replace('-','−');
/* parábola dada por concavidad (a = 1 o −1), vértice (h ; k) */
const PB=(a,h,k)=>({a,h,k,f:x=>a*(x-h)*(x-h)+k});
function roots(p){const d=-p.k/p.a;if(d<0)return[];if(d===0)return[p.h];const r=Math.sqrt(d);return[p.h-r,p.h+r]}
function pg(p,col='#8A4DFF',size=280,marks=false){const dots=marks?[[p.h,p.k],...roots(p).map(r=>[r,0])]:[];return graph([{f:p.f,col,dots}],5,size)}
const small=svg=>svg.replace('<svg','<svg style="width:120px;display:block;margin:auto"');
const GP={P1:PB(1,2,-1),P2:PB(-1,1,4),P3:PB(1,-1,-4),P4:PB(-1,-2,1),P5:PB(1,1,2),P6:PB(-1,0,4)};

/* gráfico con escalas propias (problemas) */
function cgraph({f,x0,x1,y0,y1,xs,ys,xl,yl,col}){const W=340,H=250,ml=40,mb=40,mt=12,mr=12,pw=W-ml-mr,ph=H-mt-mb;
  const X=x=>ml+(x-x0)/(x1-x0)*pw,Y=y=>mt+(y1-y)/(y1-y0)*ph;gid++;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:min(340px,100%)" role="img" aria-label="gráfico de ${yl} según ${xl}"><defs><clipPath id="cl${gid}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath></defs><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff"/>`;
  for(let x=x0;x<=x1+1e-9;x+=xs)s+=`<line x1="${X(x)}" y1="${mt}" x2="${X(x)}" y2="${mt+ph}" stroke="#DDE2F2"/><text x="${X(x)}" y="${mt+ph+14}" font-size="10" text-anchor="middle" fill="#5B6185" font-family="Lexend,sans-serif">${mn(x)}</text>`;
  for(let y=y0;y<=y1+1e-9;y+=ys)s+=`<line x1="${ml}" y1="${Y(y)}" x2="${ml+pw}" y2="${Y(y)}" stroke="#DDE2F2"/><text x="${ml-5}" y="${Y(y)+3}" font-size="10" text-anchor="end" fill="#5B6185" font-family="Lexend,sans-serif">${mn(y)}</text>`;
  if(y0<=0&&y1>=0)s+=`<line x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}" stroke="${ST}" stroke-width="2"/>`;
  s+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="${ST}" stroke-width="2"/>`;

  s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" clip-path="url(#cl${gid})"/>`;

/* analizá la parábola leyendo el gráfico */

    const card=document.createElement('div');card.className='card c'+(i%7);const id=k=>`${key}_${i}_${k}`;
    const lt=`para x < ${mn(p.h)}`,gt=`para x > ${mn(p.h)}`;
    card.innerHTML=`<div class="q"><span class="n">${i+1}</span><div class="txt" style="flex:1"><div class="graphbox gb">${pg(p,cols[i],260)}</div></div></div>
      <div class="anl">
       <label for="${id('conc')}">Concavidad<select id="${id('conc')}" data-k="conc"><option value="">elegí…</option><option value="up">hacia arriba</option><option value="down">hacia abajo</option></select></label>
       <label for="${id('xv')}">Vértice: x<input id="${id('xv')}" data-k="xv" autocomplete="off" placeholder="x"></label>
       <label for="${id('yv')}">Vértice: y<input id="${id('yv')}" data-k="yv" autocomplete="off" placeholder="y"></label>
       <label for="${id('mm')}">¿Máximo o mínimo?<select id="${id('mm')}" data-k="mm"><option value="">elegí…</option><option value="max">máximo</option><option value="min">mínimo</option></select></label>
       <label for="${id('rz')}">Raíces<input id="${id('rz')}" data-k="rz" autocomplete="off" placeholder="ej: 1 y 3"></label>
       <label for="${id('ord')}">Corta al eje y en<input id="${id('ord')}" data-k="ord" autocomplete="off" placeholder="y"></label>
       <label for="${id('cr')}">Crece…<select id="${id('cr')}" data-k="cr"><option value="">elegí…</option><option value="lt">${lt}</option><option value="gt">${gt}</option></select></label>
       <label for="${id('dc')}">Decrece…<select id="${id('dc')}" data-k="dc"><option value="">elegí…</option><option value="lt">${lt}</option><option value="gt">${gt}</option></select></label>
      </div><div class="row" style="margin-top:12px"><button class="btn go">Comprobar</button><button class="btn ghost" data-s>Ver solución</button></div><div class="fbx"></div>`;
    const F=k=>card.querySelector(`[data-k="${k}"]`);
    const want={conc:up?'up':'down',mm:up?'min':'max',cr:up?'gt':'lt',dc:up?'lt':'gt'};
    const rootsOk=v=>{const t=norm(v);if(!R.length)return /no/.test(t)||/ningun/.test(t);const nums=(t.replace(/[−–]/g,'-').match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'));
      const uniq=[...new Set(nums)].sort((a,b)=>a-b);return uniq.length===R.length&&uniq.every((x,j)=>Math.abs(x-R[j])<1e-9)};
    const rtxt=R.length?R.map(mn).join(' y '):'no tiene';
    const mark=()=>{card.querySelector('.gb').innerHTML=pg(p,cols[i],260,true)};
    $('.btn.go',card).onclick=()=>{let ok=0;const set=(k,r)=>{F(k).classList.toggle('okf',!!r);F(k).classList.toggle('badf',!r);ok+=!!r};
      for(const k of ['conc','mm','cr','dc'])set(k,F(k).value===want[k]);
      set('xv',F('xv').value.trim()&&check(F('xv').value,p.h).ok);set('yv',F('yv').value.trim()&&check(F('yv').value,p.k).ok);
      set('ord',F('ord').value.trim()&&check(F('ord').value,p.f(0)).ok);set('rz',F('rz').value.trim()&&rootsOk(F('rz').value));
      if(ok===8){award(key+i,20);confetti(90);mark();$('.fbx',card).innerHTML=`<div class="fb good"><b>${pick(cheers)}</b> ¡Leíste toda la parábola!</div>`}
      else $('.fbx',card).innerHTML=`<div class="fb bad"><b>Tenés ${ok} de 8 bien.</b> Revisá los casilleros en rojo.</div>`};
    solBtn($('[data-s]',card),()=>{F('conc').value=want.conc;F('mm').value=want.mm;F('cr').value=want.cr;F('dc').value=want.dc;F('xv').value=mn(p.h);F('yv').value=mn(p.k);F('rz').value=rtxt;F('ord').value=mn(p.f(0));mark();
      $('.fbx',card).innerHTML=`<div class="fb info"><b>Solución:</b> abre hacia ${up?'arriba':'abajo'}, vértice (${mn(p.h)} ; ${mn(p.k)}), tiene ${up?'mínimo':'máximo'}. Raíces: ${rtxt}. Corta al eje y en ${mn(p.f(0))}. ${up?`Decrece ${lt} y crece ${gt}`:`Crece ${lt} y decrece ${gt}`}.</div>`},key+i);
    el.appendChild(card)});
}

/* atrapá la recta */
function catchGame(el,TT){
  const T=TT||[[1,2],[-2,3],[0.5,-1],[-1,-2],[3,-4],[-0.5,4],[2,0]];let r=0;
  function draw(){const[ta,tb]=T[r];let a=0,b=0,solved=false;
    el.innerHTML=`<div class="small" style="text-align:center;margin-bottom:8px">Recta ${r+1} de ${T.length}</div><div class="catch"><div class="graphbox" id="cg"></div>
      <div class="sliders"><div><label for="sa"><span>Pendiente (a)</span><span id="va">0</span></label><input type="range" id="sa" min="-4" max="4" step="0.5" value="0"></div>
      <div><label for="sb"><span>Ordenada al origen (b)</span><span id="vb">0</span></label><input type="range" id="sb" min="-5" max="5" step="1" value="0"></div>
      <div class="card c3 m" style="text-align:center;font-size:1.2rem;font-weight:700" id="ff">f(x) = 0</div><div class="fbx"></div></div></div>`;
    const upd=()=>{a=+$('#sa').value;b=+$('#sb').value;$('#va').innerHTML=fmtA(a)===''?'1':(fmtA(a)==='−'?'−1':fmtA(a));if(a===0)$('#va').textContent='0';$('#vb').textContent=String(b).replace('-','−');
      $('#ff').innerHTML=formula(a,b);$('#cg').innerHTML=graph([{a:ta,b:tb,col:'#1D2140',dash:1,w:3},{a,b,col:'#8A4DFF',w:4}],5,300);
      if(!solved&&a===ta&&b===tb){solved=true;award('cat'+r);confetti(110);$('.fbx',el).innerHTML=`<div class="fb good"><b>¡La atrapaste!</b> Es ${formula(ta,tb)}: ${ta>0?'creciente':'decreciente'}, corta al eje y en ${String(tb).replace('-','−')}.</div><div class="row" style="margin-top:10px"><button class="btn blue" data-n>${r<T.length-1?'Siguiente recta →':'Volver a empezar'}</button></div>`;$('[data-n]',el).onclick=()=>{r=(r+1)%T.length;draw()}}};
    $('#sa').oninput=upd;$('#sb').oninput=upd;upd()}
  draw()}

function pairMCD(){const g=rnd(2,9);let m,n;do{m=rnd(2,7);n=rnd(2,7)}while(m===n||gcd(m,n)!==1);return[g*m,g*n]}

const divs=n=>{const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r};

  const D=[(a,b,g)=>({q:`Tengo ${a} figuritas y ${b} stickers. Quiero armar la mayor cantidad de sobres iguales sin que sobre nada.`,exp:`MCD(${a} ; ${b}) = ${g} → ${g} sobres, cada uno con ${a/g} figuritas y ${b/g} stickers.`}),
   (a,b,g)=>({q:`Hay que cortar dos cintas de ${a} m y ${b} m en trozos iguales, lo más largos posible y sin que sobre.`,exp:`MCD(${a} ; ${b}) = ${g} → trozos de ${g} m.`}),
   (a,b,g)=>({q:`Hay ${a} chicos de 1° y ${b} de 2°. Queremos equipos con la misma cantidad de integrantes, lo más numerosos posible, sin mezclar años.`,exp:`MCD(${a} ; ${b}) = ${g} → equipos de ${g} integrantes.`}),
   (a,b,g)=>({q:`En la cooperadora hay ${a} alfajores y ${b} caramelos. Quieren armar la mayor cantidad de bolsitas iguales sin que sobre nada.`,exp:`MCD(${a} ; ${b}) = ${g} → ${g} bolsitas, cada una con ${a/g} alfajores y ${b/g} caramelos.`}),
   (a,b,g)=>({q:`Un piso mide ${a} dm por ${b} dm. Quiero cubrirlo con baldosas cuadradas lo más grandes posible, sin cortar ninguna.`,exp:`MCD(${a} ; ${b}) = ${g} → baldosas de ${g} dm de lado.`}),
   (a,b,g)=>({q:`Tengo ${a} lápices rojos y ${b} azules. Quiero armar la mayor cantidad de cartucheras iguales sin que sobre ninguno.`,exp:`MCD(${a} ; ${b}) = ${g} → ${g} cartucheras, cada una con ${a/g} rojos y ${b/g} azules.`})];
  const M=[(a,b,L)=>({q:`Una luz titila cada ${a} segundos y otra cada ${b}. Si titilaron juntas, ¿cuándo vuelven a coincidir?`,exp:`MCM(${a} ; ${b}) = ${L} → a los ${L} segundos.`}),
   (a,b,L)=>({q:`Juli va al club cada ${a} días y Agus cada ${b}. Hoy se encontraron. ¿En cuántos días se vuelven a ver?`,exp:`MCM(${a} ; ${b}) = ${L} → dentro de ${L} días.`}),
   (a,b,L)=>({q:`El colectivo pasa cada ${a} minutos y la combi cada ${b}. Salieron juntos. ¿Cuándo vuelven a salir juntos?`,exp:`MCM(${a} ; ${b}) = ${L} → dentro de ${L} minutos.`}),
   (a,b,L)=>({q:`En el tambo se limpia un corral cada ${a} días y otro cada ${b}. Hoy se limpiaron los dos. ¿Cuándo se vuelven a limpiar el mismo día?`,exp:`MCM(${a} ; ${b}) = ${L} → dentro de ${L} días.`}),
   (a,b,L)=>({q:`El veterinario viene cada ${a} días y el camión del alimento cada ${b}. Hoy coincidieron. ¿Dentro de cuántos días vuelven a coincidir?`,exp:`MCM(${a} ; ${b}) = ${L} → dentro de ${L} días.`}),
   (a,b,L)=>({q:`Una alarma suena cada ${a} minutos y otra cada ${b}. Sonaron juntas. ¿Cuándo vuelven a sonar juntas?`,exp:`MCM(${a} ; ${b}) = ${L} → a los ${L} minutos.`})];
  const out=[];
  shuffle(D).slice(0,4).forEach(t=>{const[a,b]=pairMCD();out.push({...t(a,b,gcd(a,b)),opts:['MCM','MCD'],ok:1,keep:1,why:'Pista: repartir, agrupar o cortar en partes iguales es MCD.'})});
  shuffle(M).slice(0,4).forEach(t=>{const[a,b]=pairMCM();out.push({...t(a,b,lcm(a,b)),opts:['MCM','MCD'],ok:0,keep:1,why:'Pista: algo que se repite y vuelve a coincidir es MCM.'})});
  return shuffle(out)}

function genMemo1(){const pairs=[],vals=new Set();while(pairs.length<6){const d=rnd(2,8),n=Math.random()<.75?rnd(1,d-1):rnd(d+1,2*d-1);if(n%d===0)continue;const v=n/d;if(vals.has(v))continue;vals.add(v);pairs.push([`<span class="mbig">${fr(n,d)}</span>`,fracDrawing(n,d)])}

function genAc1(){const T=[

  const s=neg?-1:1,base=P(neg?nf(p,q):fr(p,q)),q_=pw(base,mn(e));let ans,wr=[];

  else if(e>0){const sg=(neg&&e%2)?-1:1;ans=[sg*p**e,q**e];wr=[F_(-sg*p**e,q**e),F_(sg*p*e,q*e),F_(sg*p**e,q),F_(sg*q**e,p**e)]}

/* ---------- 3° año: función cuadrática ---------- */
function randParab(){let p;do{const a=pick([1,-1]);const k=a>0?pick([-4,-1,0,1,2,-4,-1]):pick([4,1,0,-1,-2,4,1]);const h=rnd(-2,2);p=PB(a,h,k)}while(Math.abs(p.f(0))>5||roots(p).some(r=>Math.abs(r)>5));return p}
const PCOL=['#FF5A4E','#2F8CFF','#1DB66B','#8A4DFF','#FF4F9A','#00B3B8','#FFB800'];
function rootsTxt(p){const R=roots(p);return R.length?R.map(r=>'x = '+mn(r)).join(' y '):'no tiene'}
function genQp(){const out=[];const types=shuffle(['v','mm','rz','cr','dc','n','eje','ord','v','rz']).slice(0,8);
  types.forEach((t,i)=>{const p=randParab(),c=PCOL[i%7],G=`<div class="graphbox">${pg(p,c,220)}</div>`;const up=p.a>0,R=roots(p);let it;
    if(t==='v')it={q:G+'¿Cuál es el vértice?',opts:uniqOpts(`(${mn(p.h)} ; ${mn(p.k)})`,[`(${mn(p.k)} ; ${mn(p.h)})`,`(${mn(-p.h)} ; ${mn(p.k)})`,`(${mn(p.h)} ; ${mn(-p.k)})`,`(${mn(p.h+1)} ; ${mn(p.k)})`]),ok:0,exp:`Es el punto ${up?'más bajo':'más alto'}: x = ${mn(p.h)}, y = ${mn(p.k)}.`};
    if(t==='mm')it={q:G+'¿Tiene máximo o mínimo?',opts:['máximo','mínimo'],ok:up?1:0,keep:1,exp:`Abre hacia ${up?'arriba: el vértice es el punto más bajo':'abajo: el vértice es el punto más alto'}.`};
    if(t==='rz')it={q:G+'¿Cuáles son las raíces?',opts:uniqOpts(rootsTxt(p),[R.length?R.map(r=>'x = '+mn(-r)).join(' y '):'x = '+mn(p.h),R.length?'no tiene':'x = '+mn(p.h-1)+' y x = '+mn(p.h+1),`x = ${mn(p.h)} y x = ${mn(p.k)}`,'x = 0']),ok:0,exp:R.length?'Son los puntos donde corta al eje x.':'No corta al eje x en ningún punto.'};
    if(t==='cr')it={q:G+'¿Dónde crece?',opts:[`para x < ${mn(p.h)}`,`para x > ${mn(p.h)}`,`para x > ${mn(p.k)}`].filter((v,j,a)=>a.indexOf(v)===j),ok:up?1:0,keep:1,exp:`De izquierda a derecha, ${up?`la rama baja hasta el vértice (x = ${mn(p.h)}) y después sube`:`la rama sube hasta el vértice (x = ${mn(p.h)}) y después baja`}.`};
    if(t==='dc')it={q:G+'¿Dónde decrece?',opts:[`para x < ${mn(p.h)}`,`para x > ${mn(p.h)}`,`para x < ${mn(p.k)}`].filter((v,j,a)=>a.indexOf(v)===j),ok:up?0:1,keep:1,exp:`${up?`La rama izquierda baja hasta el vértice (x = ${mn(p.h)})`:`Después del vértice (x = ${mn(p.h)}) la rama baja`}.`};
    if(t==='n')it={q:G+'¿Cuántas raíces tiene?',opts:['ninguna','una','dos'],ok:R.length,keep:1,exp:R.length===0?'No toca el eje x.':R.length===1?'El vértice está justo sobre el eje x: lo toca en un solo punto.':'Corta al eje x en dos puntos.'};
    if(t==='eje')it={q:G+'¿Cuál es el eje de simetría?',opts:uniqOpts(`x = ${mn(p.h)}`,[`y = ${mn(p.h)}`,`x = ${mn(p.k)}`,`x = ${mn(-p.h)}`,`x = ${mn(p.h+1)}`]),ok:0,exp:'Es la recta vertical que pasa por el vértice.'};
    if(t==='ord')it={q:G+'¿Dónde corta al eje y?',opts:uniqOpts(`en ${mn(p.f(0))}`,[`en ${mn(p.k)}`,`en ${mn(p.h)}`,`en ${mn(-p.f(0))}`,`en ${mn(p.f(0)+1)}`]),ok:0,exp:`La ordenada al origen es ${mn(p.f(0))}: el punto donde la parábola cruza el eje y.`};
    out.push(it)});return out}
function genQc(){const S=g=>small(g);const out=[];const kinds=shuffle(['max','min','roots','none','one','vert','crece']).slice(0,6);
  kinds.forEach((kd,i)=>{let p,desc,ok;
    do{p=randParab()}while((kd==='max'&&p.a>0)||(kd==='min'&&p.a<0)||(kd==='roots'&&roots(p).length!==2)||(kd==='none'&&roots(p).length)||(kd==='one'&&roots(p).length!==1)||(kd==='crece'&&p.a>0));
    const R=roots(p);
    if(kd==='max'){desc=`Tiene un <b>máximo</b> en el punto (${mn(p.h)} ; ${mn(p.k)}).`;ok=q=>q.a<0&&q.h===p.h&&q.k===p.k}
    if(kd==='min'){desc=`Tiene un <b>mínimo</b> en el punto (${mn(p.h)} ; ${mn(p.k)}).`;ok=q=>q.a>0&&q.h===p.h&&q.k===p.k}
    if(kd==='roots'){desc=`Sus raíces son x = ${mn(R[0])} y x = ${mn(R[1])}, y abre hacia ${p.a>0?'arriba':'abajo'}.`;ok=q=>q.a===p.a&&roots(q).join()===R.join()}
    if(kd==='none'){desc='<b>No</b> corta al eje x.';ok=q=>roots(q).length===0}
    if(kd==='one'){desc='Tiene <b>una sola</b> raíz.';ok=q=>roots(q).length===1}
    if(kd==='vert'){desc=`Su vértice es (${mn(p.h)} ; ${mn(p.k)}).`;ok=q=>q.h===p.h&&q.k===p.k}
    if(kd==='crece'){desc=`Crece para x < ${mn(p.h)} y decrece para x > ${mn(p.h)}.`;ok=q=>q.a<0&&q.h===p.h}
    const ds=[PB(-p.a,p.h,p.k),PB(p.a,-p.h||p.h+2,p.k),PB(p.a,p.h,-p.k||1)];const wr=[];
    for(const q of ds)if(!ok(q)&&Math.abs(q.f(0))<=6&&wr.length<2)wr.push(q);
    while(wr.length<2){const q=randParab();if(!ok(q))wr.push(q)}
    out.push({q:desc,opts:[S(pg(p,PCOL[i],200)),S(pg(wr[0],PCOL[(i+2)%7],200)),S(pg(wr[1],PCOL[(i+4)%7],200))],ok:0,exp:`Es la parábola de vértice (${mn(p.h)} ; ${mn(p.k)}), que abre hacia ${p.a>0?'arriba':'abajo'}.`})});return out}
function genQa(){const out=[],seen=new Set();while(out.length<6){const p=randParab();const k=p.a+','+p.h+','+p.k;if(seen.has(k))continue;seen.add(k);out.push(p)}return out}
function genQpb(){
  const v=pick([10,20,30]),tm=v/10,hm=v*v/20,tf=2*tm;
  const pel=cgraph({f:t=>-5*t*t+v*t,x0:0,x1:tf,y0:0,y1:hm,xs:1,ys:hm<=5?1:hm<=20?5:5,xl:'tiempo (segundos)',yl:'altura (metros)',col:'#FF5A4E'});
  const pit=[{q:'¿Cuál es la altura máxima que alcanza la pelota (en metros)?',ans:hm,sol:`Es la y del vértice: ${hm} m.`},
    {q:'¿A los cuántos segundos llega a esa altura?',ans:tm,sol:`Es la x del vértice: a los ${tm} segundos.`},
    {q:'¿A los cuántos segundos vuelve a tocar el piso?',ans:tf,sol:`Es la otra raíz: t = ${tf} (la primera es t = 0, cuando sale).`}];
  if(v>=20)pit.push({q:'¿A qué altura está al segundo 1?',ans:v-5,sol:`Buscá x = 1 y subí hasta la curva: ${v-5} m.`});
  pit.push({q:'La pelota sube desde el segundo 0 hasta el segundo…',ans:tm,sol:`Crece de 0 a ${tm} y decrece de ${tm} a ${tf}.`});
  const [a,c,m]=pick([[1,3,1],[1,3,4],[0.5,4,2]]);const z=Math.sqrt(m/a),T0=a*c*c-m;
  const tem=cgraph({f:h=>a*(h-c)*(h-c)-m,x0:0,x1:2*c,y0:-m-1,y1:Math.ceil(T0),xs:1,ys:T0>8?2:1,xl:'hora de la madrugada',yl:'temperatura (°C)',col:'#2F8CFF'});
  return[{t:'⚽ La pelota',d:`Lucas patea una pelota hacia arriba. El gráfico muestra la altura de la pelota según el tiempo.`,gr:pel,it:pit},
   {t:'❄️ Una noche de helada',d:`El gráfico muestra la temperatura en el campo durante una madrugada de invierno, desde las 0 h hasta las ${2*c} h.`,gr:tem,it:[
     {q:'¿Cuál fue la temperatura mínima (en °C)?',ans:-m,sol:`Es la y del vértice: ${mn(-m)} °C.`},
     {q:'¿A qué hora fue la temperatura mínima?',ans:c,sol:`Es la x del vértice: a las ${c} h.`},

     {q:'¿Qué temperatura había a las 0 h?',ans:T0,sol:`Es la ordenada al origen: ${T0} °C.`}]}]}

const ICON={silla:'🪑',mesa:'🍽️',planta:'🌳'};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
function murdoku(el){
  let cur=0;
  function draw(){
    const M=MK[cur],pos={};let pen=M.people[0][0],solved=false;
    const label={};for(let r=0;r<6;r++)for(let c=0;c<6;c++){const R=M.rooms[r][c];if(!Object.values(label).includes(R)&&!(R in Object.fromEntries(Object.entries(label).map(([k,v])=>[v,k]))))label[r+','+c]=R}
    const nameOf=v=>v==='OBJ'?M.objn:(M.people.find(p=>p[0]===v)||[])[1];
    el.innerHTML=`<div class="row" style="margin-bottom:14px">${MK.map((m,i)=>`<button class="btn ${i===cur?'pink':'ghost'}" data-case="${i}">Caso ${i+1} ${m.obj}</button>`).join('')}</div>
      <h4 class="mktitle">${M.t} ${M.obj}</h4><p style="margin:.3rem 0 14px">${M.story}</p>
      <div class="mkwrap"><div>
        <div class="pens" role="toolbar" aria-label="Qué querés poner">${M.people.map(([i,n])=>`<button class="pen" data-v="${i}" title="${n}" aria-label="${n}">${i}</button>`).join('')}<button class="pen" data-v="OBJ" title="${M.objn}" aria-label="${M.objn}">${M.obj}</button><button class="pen" data-v="X" title="Acá no va nadie" aria-label="Cruz: acá no va nadie">✗</button><button class="pen" data-v="" title="Borrar" aria-label="Borrar">⌫</button></div>
        <div class="small" style="margin-bottom:8px">Elegí arriba qué poner y tocá la casilla.</div>
        <div class="mk" id="mkg"></div>
        <div class="legend"><span>🪑 silla</span><span>🍽️ mesa</span><span>🌳 árbol</span>${M.people.map(([i,n])=>`<span><b>${i}</b> ${n}</span>`).join('')}<span>✗ no va nadie</span></div></div>
      <div><div class="card c4"><h4>Reglas</h4><ul class="clues"><li>En cada <b>fila</b> y en cada <b>columna</b> hay una sola persona u objeto (las 5 personas y ${M.objn}).</li><li>Filas de arriba hacia abajo y columnas de izquierda a derecha, del 1 al 6.</li><li>Nadie puede pararse en el árbol ni arriba de una mesa.</li><li>“Al lado” es la casilla de arriba, abajo, izquierda o derecha, <b>dentro de la misma habitación</b> (sin pared en el medio).</li><li>Quien lo hizo es la <b>única</b> persona que estaba en la misma habitación que ${M.objn}.</li></ul></div>
        <div class="card c1" style="margin-top:12px"><h4>Pistas</h4><div class="small" style="margin-bottom:6px">💡 Buscá la pista que deja una sola casilla posible y empezá por ahí. Cada persona que ubicás ocupa su fila y su columna: usalo para descartar casillas de los demás.</div><ol class="clues">${M.clues.map(c=>`<li class="m">${c}</li>`).join('')}</ol></div>
        <div class="row" style="margin-top:12px"><button class="btn go" data-c>Comprobar el plano</button><button class="btn ghost" data-x>Borrar todo</button><button class="btn ghost" data-prof>🔒 Solución (profe)</button></div><div id="profbox" hidden><div class="ans"><input id="profcode_${cur}" type="password" aria-label="Código de la profe" autocomplete="off" placeholder="código de la profe"><button class="btn blue" data-pc>Ver</button></div><div class="fbx" id="proffb"></div></div>
        <div class="fbx" id="mkfb"></div>
        <div class="card c6" style="margin-top:12px"><b>¿Quién fue?</b><div class="small" id="mklock">Primero armá bien el plano y tocá “Comprobar el plano”.</div>
          <div class="ans"><input id="mkwho_${cur}" aria-label="Nombre de quién fue" autocomplete="off" placeholder="escribí el nombre" disabled><button class="btn pink" data-w disabled>¡Lo descubrí!</button></div><div class="fbx" id="mkfb2"></div></div>
      </div></div>`;
    el.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{cur=+b.dataset.case;draw()});
    const pens=[...el.querySelectorAll('.pen')];const setPen=v=>{pen=v;pens.forEach(p=>p.classList.toggle('on',p.dataset.v===v))};pens.forEach(p=>p.onclick=()=>setPen(p.dataset.v));setPen(pen);
    const g=$('#mkg',el);
    function paint(){g.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<6;c++){const k=r+','+c,R=M.rooms[r][c],fu=M.fur[k],v=pos[k];const b=document.createElement('button');b.className='mkc';
      const edge=(bool)=>bool?'3px solid #1D2140':'1px solid rgba(29,33,64,.15)';
      b.style.cssText=`background:${RCOL[R]};border-top:${edge(r===0||M.rooms[r-1][c]!==R)};border-bottom:${edge(r===5||M.rooms[r+1][c]!==R)};border-left:${edge(c===0||M.rooms[r][c-1]!==R)};border-right:${edge(c===5||M.rooms[r][c+1]!==R)}`;
      b.setAttribute('aria-label',`Fila ${r+1}, columna ${c+1}, ${M.RN[R]}${fu?', '+fu:''}${v?', '+(v==='X'?'cruz':nameOf(v)):''}`);
      let inner=label[k]?`<span class="rn">${M.RN[label[k]]}</span>`:'';
      if(v==='X')inner+=`<span class="xx">✗</span>`;else if(v==='OBJ')inner+=`<span class="ob">${M.obj}</span>`;else if(v)inner+=`<span class="who">${v}</span>`;
      if(fu)inner+=v?`<span class="ic2">${ICON[fu]}</span>`:`<span class="ic">${ICON[fu]}</span>`;
      if(v&&v!=='X'){const clash=Object.entries(pos).some(([kk,vv])=>kk!==k&&vv!=='X'&&(kk.split(',')[0]==String(r)||kk.split(',')[1]==String(c)));if(clash)b.style.boxShadow='inset 0 0 0 4px #E5383B'}
      b.innerHTML=inner;
      b.onclick=()=>{if(fu==='planta'){toast('Ahí está el árbol: no va nadie');return}
        if(fu==='mesa'&&pen&&pen!=='X'&&pen!=='OBJ'){toast('Nadie puede pararse arriba de una mesa');return}
        if(!pen||pos[k]===pen){delete pos[k]}else{if(pen!=='X')for(const kk in pos)if(pos[kk]===pen)delete pos[kk];pos[k]=pen}
        if(pen&&pen!=='X'&&pos[k]===pen&&Object.entries(pos).some(([kk,vv])=>kk!==k&&vv!=='X'&&(kk.split(',')[0]==String(r)||kk.split(',')[1]==String(c))))toast('¡Ojo! Ya hay alguien en esa fila o columna');
        paint()};
      g.appendChild(b)}}
    paint();
    const unlock=()=>{$('#mklock',el).textContent='¡Plano listo! Escribí el nombre de quién fue.';$('#mkwho_'+cur,el).disabled=false;$('[data-w]',el).disabled=false;$('#mkwho_'+cur,el).focus()};
    $('[data-c]',el).onclick=()=>{let good=0,placed=0;for(const it in M.sol){const k=M.sol[it];if(pos[k]===it)good++}
      for(const k in pos)if(pos[k]!=='X')placed++;
      const wrong=placed-good;
      if(good===6&&!wrong){$('#mkfb',el).innerHTML=`<div class="fb good"><b>¡Plano perfecto!</b> Ahora escribí quién fue.</div>`;award('mkplano'+cur,30);confetti(120);unlock()}
      else $('#mkfb',el).innerHTML=`<div class="fb bad"><b>Tenés ${good} de 6 bien ubicados.</b> ${wrong?`Hay ${wrong} en un lugar equivocado. `:''}${placed<6?`Te falta${6-placed===1?'':'n'} ubicar ${6-placed}. `:''}Volvé a leer las pistas.</div>`};
    $('[data-x]',el).onclick=()=>{for(const k in pos)delete pos[k];paint()};
    $('[data-prof]',el).onclick=()=>{const bx=$('#profbox',el);bx.hidden=!bx.hidden;if(!bx.hidden)$('#profcode_'+cur,el).focus()};
    const showSol=()=>{if(hh($('#profcode_'+cur,el).value)!=='19ljn52'){$('#proffb',el).innerHTML='<div class="fb bad"><b>Código incorrecto.</b> Esta opción es solo para la profe.</div>';return}
      for(const k in pos)delete pos[k];for(const it in M.sol)pos[M.sol[it]]=it;paint();
      $('#proffb',el).innerHTML=`<div class="fb info"><b>Cómo se resuelve:</b><ol class="clues" style="margin-top:6px">${M.steps.map(x=>`<li>${x}</li>`).join('')}</ol><b>Fue ${M.culprit}.</b></div>`;$('#profcode_'+cur,el).value=''};
    $('[data-pc]',el).onclick=showSol;$('#profcode_'+cur,el).onkeydown=e=>{if(e.key==='Enter')showSol()};
    const tryWho=()=>{const v=norm($('#mkwho_'+cur,el).value);if(!v)return;const ok=v===norm(M.culprit)||v.startsWith(norm(M.culprit)+' ');
      $('#mkfb2',el).innerHTML=ok?`<div class="fb good"><b>¡Caso resuelto! Fue ${M.culprit}.</b> ${M.why}</div>`:`<div class="fb bad"><b>No es correcto. ¡Seguí intentando!</b></div>`;
      if(ok){award('mkwho'+cur,30);confetti(200)}};
    $('[data-w]',el).onclick=tryWho;$('#mkwho_'+cur,el).onkeydown=e=>{if(e.key==='Enter')tryWho()};
  }
  draw()}

const YEARS={1:Y1,2:Y2,3:Y3};
const app=$('#app');
function home(){state.year=null;
  app.innerHTML=`<div class="hero"><h1 aria-label="Aula Matemática">${[...'Aula Matemática'].map(c=>c===' '?'&nbsp;':`<span>${c}</span>`).join('')}</h1>
   <p>Repasá jugando: desafíos, acertijos, memotest, contrarreloj y mucho más.</p><span class="sig">Profe Meli</span></div>
   <div class="doors">${[Y1,Y2,Y3].map(y=>`<button class="door ${y.cls}" data-y="${y.n}"><span class="deco" aria-hidden="true">${y.deco}</span><span class="big">${y.n}°</span><span style="font-family:var(--display);font-size:1.5rem">año</span><span class="topics">${y.topics}</span><span class="lock">🔒 Entrar con la clave</span></button>`).join('')}</div>
   <p class="homeNote">Cada año tiene su propia clave. Pedísela a la profe y entrá solo a la de tu curso.</p>
   <h2 style="text-align:center;margin-top:26px;font-size:1.8rem">🏆 Ranking de esta compu</h2>
   <div class="homeRank">${[1,2,3].map(y=>{const rows=rankRows(y).slice(0,3);const md=['🥇','🥈','🥉'];return `<div class="card c${y*2-1}"><h4 style="font-family:var(--display);font-weight:400;font-size:1.3rem">${y}° año</h4>${rows.length?rows.map((r,i)=>`<div class="rk"><span>${md[i]} ${escH(r.n)}</span><b>${r.p} pts</b></div>`).join(''):'<p class="small" style="margin:0">Todavía nadie jugó en esta compu.</p>'}</div>`}).join('')}</div>
   <footer>Matemática · Ciclo Básico</footer>`;
  app.querySelectorAll('.door').forEach(d=>d.onclick=()=>askPass(+d.dataset.y));
  scrollTo(0,0)}
function askPass(n){const y=YEARS[n];const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<form class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${y.title}</h2><p>Escribí la clave que te dio la profe.</p>
   <div class="field"><label for="pw">Clave</label><input id="pw" type="password" autocomplete="off" required></div>
   <div class="field"><label for="nm">Tu nombre y apellido</label><input id="nm" autocomplete="off" maxlength="40" required></div>
   <div class="err" id="er" aria-live="polite"></div><div class="row"><button class="btn go" type="submit">Entrar</button><button class="btn ghost" type="button" data-cancel>Cancelar</button></div></form>`;
  document.body.appendChild(ov);$('#pw',ov).focus();
  const close=()=>ov.remove();$('[data-cancel]',ov).onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});ov.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  $('form',ov).onsubmit=e=>{e.preventDefault();if(!$('#nm',ov).value.trim()){$('#er',ov).textContent='Escribí tu nombre para entrar.';$('#nm',ov).focus();return}if(hh($('#pw',ov).value)===y.pass){state.name=$('#nm',ov).value.trim();close();enter(n)}else{$('#er',ov).textContent='Esa no es la clave de '+y.title+'. Probá de nuevo.';const m=$('.modal',ov);m.classList.add('shake');setTimeout(()=>m.classList.remove('shake'),400);$('#pw',ov).select()}}}
function enter(n){state.year=n;const y=YEARS[n];
  {const{e}=me();state.points[n]=e.p||0;state.done=new Set([...state.done].filter(k=>!k.startsWith(n+'|')).concat(e.done||[]));state.genMap=e.gen||{};syncMe()}
  app.innerHTML=`<div class="bar"><button class="btn ghost" id="back">← Salir</button><div style="min-width:0"><h2>${y.title}</h2><div class="hi">¡Hola, ${escH(state.name)}! ${y.topics}</div></div><span class="spacer"></span><span class="stars" title="Puntos que juntaste">⭐ <span id="pts">${state.points[n]}</span> puntos</span></div>
   <nav class="navg" aria-label="Actividades">${(y.groups||[{name:'',acts:y.acts}]).map(g=>`<div>${g.name?`<div class="glabel">${g.name}</div>`:''}<div class="chips">${g.acts.map(a=>`<button class="chip" data-a="${a.id}" aria-pressed="false">${a.label}</button>`).join('')}</div></div>`).join('')}</nav><section class="panel" id="panel"></section>
   <footer>Al salir se cierra con clave otra vez · Profe Meli</footer>`;
  $('#back').onclick=()=>{stopPanel();home()};
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>openAct(c.dataset.a));
  openAct(y.acts[0].id);scrollTo(0,0)}
function stopPanel(){const p=$('#panel');if(p&&p._inner&&p._inner._stop)p._inner._stop()}
function openAct(id){stopPanel();const y=YEARS[state.year],a=y.acts.find(x=>x.id===id);state.act=id;state.gen=state.genMap[id]||0;
  app.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.a===id?'true':'false'));
  const p=$('#panel');p.innerHTML=`<div class="phead"><div style="min-width:0;flex:1 1 260px"><h3>${a.title}</h3><p class="intro">${a.intro}</p></div>${a.regen===false?'':'<button class="btn blue" id="regen">🔄 Otros ejercicios</button>'}</div><div></div>`;
  const inner=p.lastElementChild;p._inner=inner;a.run(inner);
  const rg=$('#regen');if(rg)rg.onclick=()=>{state.genMap[id]=(state.genMap[id]||0)+1;syncMe();openAct(id);toast('¡Ejercicios nuevos!')}}
home();
</script>
